[package]
name = "wasmtime-internal-cranelift"
version.workspace = true
authors.workspace = true
description = "INTERNAL: Integration between Cranelift and Wasmtime"
license = "Apache-2.0 WITH LLVM-exception"
repository = "https://github.com/bytecodealliance/wasmtime"
documentation = "https://docs.rs/wasmtime-cranelift/"
categories = ["wasm"]
keywords = ["webassembly", "wasm"]
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
log = { workspace = true }
cranelift-codegen = { workspace = true, features = ["host-arch", "incremental-cache"] }
cranelift-frontend = { path = "../../cranelift/frontend", version = "0.136.0-dev", default-features = false }
cranelift-entity = { workspace = true }
cranelift-native = { path = "../../cranelift/native", version = "0.136.0-dev", default-features = false }
cranelift-control = { workspace = true }
wasmparser = { workspace = true }
target-lexicon = { workspace = true }
gimli = { workspace = true, features = ['write'] }
object = { workspace = true, features = ['write_core'] }
smallvec = { workspace = true }
thiserror = { version = "2.0.17", default-features = false }
wasmtime-versioned-export-macros = { workspace = true }
itertools = { version = "0.14.0", default-features = false, features = ["use_alloc"] }
pulley-interpreter = { workspace = true, optional = true }
wasmtime-core = { workspace = true }
wasmtime-unwinder = { workspace = true, features = ["cranelift"] }
spin = { version = "0.9.8", default-features = false, features = ["mutex", "spin_mutex"], optional = true }

[dependencies.wasmtime-environ]
workspace = true
features = [
  "component-model",
  "gc-drc",
  "gc-null",
  "gc-copying",
  "stack-switching",
]

[features]
default = ["std"]
std = [
  "cranelift-codegen/std",
  "cranelift-codegen/timing",
  "cranelift-frontend/std",
  "cranelift-native/std",
  "gimli/std",
  "itertools/use_std",
  "object/std",
  "object/write",
  "thiserror/std",
  "wasmtime-environ/compile",
  "wasmtime-environ/threads",
]
embedded = [
  "dep:spin",
  "wasmtime-environ/compile-core",
]
all-arch = ["cranelift-codegen/all-arch"]
host-arch = ["cranelift-codegen/host-arch"]
pulley = ["cranelift-codegen/pulley", "dep:pulley-interpreter"]
trace-log = ["cranelift-codegen/trace-log"]
